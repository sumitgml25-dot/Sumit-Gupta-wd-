<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Car Gallery</title>

<style>

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff6a00, #ee0979, #00c6ff, #0072ff);
    background-size: 400% 400%;
    animation: gradientMove 10s ease infinite;
    color: white;
}

/* ANIMATION */
@keyframes gradientMove {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

/* HEADER */
header {
    text-align: center;
    padding: 30px 10px;
}

header h1 {
    font-size: 5em;
    text-shadow: 0 0 15px rgba(255,255,255,0.7);
}

header p {
    margin-top: 10px;
}

/* GALLERY FULL PAGE */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* CARD */
.card {
    position: relative;
    height: 260px;
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.1);
    transition: 0.4s ease;
}

/* IMAGE */
.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.6s ease;
}

/* OVERLAY */
.overlay {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    display: flex;
    justify-content: center;
    align-items: flex-end;
    opacity: 0;
    transition: 0.4s ease;
}

.overlay h2 {
    margin-bottom: 20px;
}

/* HOVER */
.card:hover {
    transform: scale(1.08);
    box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
}

.card:hover img {
    transform: scale(1.2);
    filter: brightness(1.3) saturate(1.3);
}

.card:hover .overlay {
    opacity: 1;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 15px;
    font-size: 1.9em;
    opacity: 0.8;
}

</style>
</head>

<body>

<header>
    <h1>🚗 Ultimate Car Gallery</h1>
    <p>Explore Speed • Power • Luxury</p>
</header>

<section class="gallery">

        <div class="card"><img src="https://images.unsplash.com/photo-1502877338535-766e1452684a"><div class="overlay"><h2>Ferrari</h2></div></div>

    <div class="card"><img src="https://images.unsplash.com/photo-1494976388531-d1058494cdd8"><div class="overlay"><h2>Mustang</h2></div></div>

    <div class="card"><img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c"><div class="overlay"><h2>Audi</h2></div></div>

    <div class="card"><img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70"><div class="overlay"><h2>Porsche</h2></div></div>

    <div class="card"><img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d"><div class="overlay"><h2>BMW</h2></div></div>

    <div class="card"><img src="https://images.unsplash.com/photo-1583267746897-2cf415887172"><div class="overlay"><h2>Mercedes</h2></div></div>

    
</section>

<footer>
    <p>✨ Designed for a Modern UI Experience</p>
</footer>

</body>
</html>
