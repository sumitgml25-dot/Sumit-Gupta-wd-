<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Modern Website</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* BODY */
body {
    font-family: 'Poppins', sans-serif;
    color: white;
    transition: 0.4s;
}

/* ANIMATED BACKGROUND */
body {
    background: linear-gradient(-45deg, #1e3c72, #2a5298, #ff6a00, #ee0979);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
}

@keyframes gradientBG {
    0% {background-position: 0%}
    50% {background-position: 100%}
    100% {background-position: 0%}
}

/* DARK MODE */
.dark {
    background: #111 !important;
    color: white;
}

/* HEADER */
header {
    text-align: center;
    padding: 30px;
    font-size: 2.5rem;
}

/* TOGGLE BUTTON */
.toggle-btn {
    position: absolute;
    right: 20px;
    top: 20px;
    padding: 10px 15px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
}

/* NAV */
nav {
    display: flex;
    justify-content: center;
    gap: 20px;
    background: rgba(255,255,255,0.1);
    padding: 15px;
}

nav a {
    color: white;
    text-decoration: none;
}

/* GRID */
.container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    padding: 30px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    transition: 0.4s;
}

.card:hover {
    transform: scale(1.05);
}

.card i {
    font-size: 35px;
    margin-bottom: 10px;
}

/* GALLERY */
.gallery {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 30px;
}

.gallery img {
    width: 100%;
    border-radius: 10px;
    transition: 0.4s;
}

.gallery img:hover {
    transform: scale(1.1);
}

/* FORM */
.form-box {
    width: 300px;
    margin: auto;
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.form-box input {
    width: 100%;
    margin: 10px 0;
    padding: 10px;
    border: none;
    border-radius: 8px;
}

.form-box button {
    padding: 10px;
    border: none;
    background: #ffd369;
    cursor: pointer;
    border-radius: 10px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
}

/* MEDIA QUERIES */
@media(max-width:900px) {
    .container {
        grid-template-columns: repeat(2,1fr);
    }
    .gallery {
        grid-template-columns: repeat(2,1fr);
    }
}

@media(max-width:600px) {
    .container {
        grid-template-columns: 1fr;
    }
    .gallery {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<button class="toggle-btn" onclick="toggleMode()">🌙 Mode</button>

<header>🚀 Advanced Web Design</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">Gallery</a>
    <a href="#">Login</a>
</nav>

<!-- CARDS -->
<section class="container">
    <div class="card">
        <i class="fa fa-code"></i>
        <h3>Development</h3>
        <p>Modern coding solutions</p>
    </div>

    <div class="card">
        <i class="fa fa-paint-brush"></i>
        <h3>Design</h3>
        <p>Creative UI/UX</p>
    </div>

    <div class="card">
        <i class="fa fa-mobile"></i>
        <h3>Mobile Apps</h3>
        <p>Responsive apps</p>
    </div>
</section>

<!-- GALLERY -->
<section class="gallery">
    <img src="https://picsum.photos/300?1">
    <img src="https://picsum.photos/300?2">
    <img src="https://picsum.photos/300?3">
    <img src="https://picsum.photos/300?4">
</section>

<!-- LOGIN FORM -->
<section class="form-box">
    <h3>Login</h3>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button>Login</button>
</section>

<footer>
    © 2026 Advanced Website | Made with CSS3 ✨
</footer>

<script>
function toggleMode() {
    document.body.classList.toggle("dark");
}
</script>

</body>
</html>
